    <circle cx="160" cy="58" r="3" opacity="0.5"/>
    <circle cx="430" cy="210" r="3" opacity="0.5"/>
    <circle cx="70" cy="300" r="3" opacity="0.4"/>
    <circle cx="452" cy="380" r="4" opacity="0.5"/>
