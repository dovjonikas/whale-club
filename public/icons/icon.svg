    <radialGradient id="night" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0d2550"/>
      <stop offset="0.62" stop-color="#06122b"/>
      <stop offset="1" stop-color="#020409"/>
    </radialGradient>
    <radialGradient id="glass" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#1f5363"/>
      <stop offset="1" stop-color="#0a2738"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <g id="mark">
  <g fill="#fff4d6">
